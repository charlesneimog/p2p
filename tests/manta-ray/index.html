<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wooden Manta Ray Automaton</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://charlesneimog.github.io/css/output.css" rel="stylesheet" />
  </head>
  <body class="min-h-screen overflow-hidden bg-[#121212] font-display text-white">
    <div class="fixed inset-0 overflow-hidden bg-[#121212]" id="manta-canvas"></div>
    <div class="fixed top-4 right-4 z-50 w-full max-w-2xl max-sm:max-w-[90vw] grid gap-3 p-4 text-sm text-white bg-[#121212] border border-white/10 rounded-xl shadow-lg backdrop-blur-sm">
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2 items-center">
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Room</span>
          <input class="h-10 w-full px-2 text-white bg-white/20 border border-white/10 rounded-lg focus:outline-none focus:border-primary" id="p2p-room" autocomplete="off" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Name</span>
          <input class="h-10 w-full px-2 text-white bg-white/20 border border-white/10 rounded-lg focus:outline-none focus:border-primary" id="p2p-name" autocomplete="off" />
        </label>
        <button class="cursor-pointer h-10 px-4 font-medium text-sm text-white bg-white/20 border border-white/10 rounded-lg hover:opacity-90 transition" id="p2p-connect" type="button">Connect</button>
        <button class="cursor-pointer h-10 px-4 font-medium text-sm text-text-dark-secondary bg-white/20 border border-white/10 rounded-lg hover:opacity-90 transition" id="p2p-disconnect" type="button" disabled>Disconnect</button>
        <div class="min-w-[84px] text-sm text-text-dark-secondary" id="p2p-status">Disconnected</div>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 items-center">
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Line thickness</span>
          <input class="h-10 w-full" id="shape-morph" type="range" min="0" max="35" value="35" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Movement</span>
          <input class="h-10 w-full" id="movement-amplitude" type="range" min="0" max="200" value="60" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Dispersion</span>
          <input class="h-10 w-full" id="dispersion" type="range" min="0" max="600" value="0" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Frame random</span>
          <input class="h-10 w-full" id="frame-randomness" type="range" min="0" max="25" value="0" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Phase spread</span>
          <input class="h-10 w-full" id="phase-spread" type="range" min="0" max="200" value="200" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Length variety</span>
          <input class="h-10 w-full" id="length-variety" type="range" min="0" max="100" value="100" />
        </label>
      </div>
      <div class="grid grid-cols-2 lg:grid-cols-3 gap-2 items-center">
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Width variety</span>
          <input class="h-10 w-full" id="width-variety" type="range" min="0" max="100" value="100" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Line count</span>
          <input class="h-10 w-full" id="density" type="range" min="0" max="500" value="500" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Speed</span>
          <input class="h-10 w-full" id="motion-speed" type="range" min="0" max="250" value="1" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Bend variety</span>
          <input class="h-10 w-full" id="bend-variety" type="range" min="0" max="100" value="100" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Depth variety</span>
          <input class="h-10 w-full" id="depth-variety" type="range" min="0" max="100" value="100" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">3D direction</span>
          <input class="h-10 w-full" id="direction-variety" type="range" min="0" max="100" value="0" />
        </label>
        <label class="grid gap-1 min-w-[84px]">
          <span class="text-xs text-text-dark-secondary">Camera scale</span>
          <input class="h-10 w-full" id="camera-scale" type="range" min="45" max="220" value="220" />
        </label>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.9.4/lib/p5.min.js"></script>
    <script src="../../p2p.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
