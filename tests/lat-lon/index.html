<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Send Location</title>
        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
        <link href="https://charlesneimog.github.io/css/output.css" rel="stylesheet" />
    </head>
    <body class="bg-background-light dark:bg-background-dark min-h-screen font-display text-base text-text-light-primary dark:text-text-dark-primary">
        <main class="w-full max-w-md mx-auto p-4 sm:p-6 flex flex-col gap-4">
            <header class="bg-gray-100/50 dark:bg-black/20 border border-gray-300 dark:border-gray-700 rounded-xl p-4 shadow-md">
                <h1 class="text-2xl font-bold tracking-tight">Send Location</h1>
            </header>

            <section class="bg-gray-100/50 dark:bg-black/20 border border-gray-300 dark:border-gray-700 rounded-xl p-4 flex flex-col gap-4 shadow-md">
                <label class="flex flex-col gap-2 text-sm font-medium text-text-light-secondary dark:text-text-dark-secondary" for="room">
                    <span>Room</span>
                    <input class="w-full bg-background-light dark:bg-background-dark border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 text-base text-text-light-primary dark:text-text-dark-primary focus:outline-none focus:border-primary transition-colors" id="room" value="node-alpha" />
                </label>

                <button class="cursor-pointer bg-black dark:bg-white text-white dark:text-black font-medium text-sm px-5 py-2 rounded-lg hover:opacity-90 transition" id="connect" type="button">Connect and send location</button>
                <p class="text-sm text-text-light-secondary dark:text-text-dark-secondary" id="user"></p>
                <p class="w-full bg-gray-100/50 dark:bg-black/20 text-text-light-secondary dark:text-text-dark-secondary border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-2 text-sm font-medium" id="status">Disconnected</p>
            </section>
        </main>

        <script src="../../p2p.js"></script>
        <script>
            const room = document.getElementById("room");
            const connectButton = document.getElementById("connect");
            const userName = `user_${Math.floor(Math.random() * 10000)
                .toString()
                .padStart(4, "0")}`;
            document.getElementById("user").textContent = `User: ${userName}`;
            const status = document.getElementById("status");
            let network;
            let locationWatch;
            let sendInterval;
            let lastPosition;

            function sendLocation(position) {
                if (!network) return;
                lastPosition = position;

                const message = JSON.stringify({
                    coords: [userName, position.coords.latitude, position.coords.longitude],
                });
                let sent = 0;

                for (const peer of network.peers.values()) {
                    if (peer.name === "PureData" && peer.dc?.readyState === "open") {
                        peer.dc.send(message);
                        sent++;
                    }
                }

                status.textContent = sent
                    ? `Sent ${position.coords.latitude}, ${position.coords.longitude} to ${sent} PureData peer(s)`
                    : "Location ready; waiting for PureData";
            }

            connectButton.onclick = () => {
                const roomName = room.value.trim();
                if (!roomName) return;

                connectButton.disabled = true;
                status.textContent = "Connecting…";
                network = new SimpleP2P(roomName, userName);

                network.onLog = (message) => {
                    if (message.startsWith("DataChannel open") && lastPosition) sendLocation(lastPosition);
                };

                network.onConnect = () => {
                    status.textContent = "Connected; requesting location…";
                    locationWatch = navigator.geolocation.watchPosition(sendLocation, (error) => {
                        status.textContent = error.message;
                    });
                    sendInterval = setInterval(() => {
                        if (lastPosition) sendLocation(lastPosition);
                    }, 100);
                };

                network.onPeerJoin = () => {
                    if (lastPosition) sendLocation(lastPosition);
                };

                network.onError = () => {
                    status.textContent = "Connection failed";
                };

                network.onDisconnect = () => {
                    if (locationWatch !== undefined) navigator.geolocation.clearWatch(locationWatch);
                    clearInterval(sendInterval);
                    connectButton.disabled = false;
                    status.textContent = "Disconnected";
                    network = null;
                };

                network.connect();
            };
        </script>
    </body>
</html>
