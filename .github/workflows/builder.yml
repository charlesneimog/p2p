---
name: Build and publish Pure Data and Max packages
on:
    workflow_dispatch:
        inputs:
            publish_release:
                description: Publish a GitHub Release using LIBVERSION after build
                required: false
                type: boolean
                default: false
env:
    LIBNAME: p2p
    LIBVERSION: "0.1.0"
permissions:
    contents: write
jobs:
    macos:
        runs-on: ${{ matrix.machines }}
        strategy:
            matrix:
                precision: [32]
                machines: [macos-latest]
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Install PureData and Deps
              run: |
                  brew install pd
                  brew install boost
                  ls -la $(brew --prefix boost)/include/boost/lockfree
                  find $(brew --prefix boost)/include -name spsc_queue.hpp
            - name: Build
              run: |
                  export CXXFLAGS="-I$(brew --prefix boost)/include"
                  cmake -S . -B build \
                    -DP2P_BUILD_MAX=ON \
                    -DPD_FLOATSIZE=${{ matrix.precision }} \
                    -DPD_LIB_DIR=./ \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_OSX_ARCHITECTURES="arm64" \
                    -DBOOST_ROOT=$(brew --prefix boost) \
                    -DBoost_INCLUDE_DIR=$(brew --prefix boost)/include
                  cmake --build build --parallel
                  find build -name "*.so" -exec otool -L {} \;
            - name: Upload Pure Data package
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-pd${{ matrix.precision }}-${{ matrix.machines }}
                  path: build/${{env.LIBNAME}}
            - name: Upload Max package
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-max-${{ matrix.machines }}
                  path: build/${{ env.LIBNAME }}-max-package
                  if-no-files-found: error
    linux:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                arch: [amd64]
                precision: [32]
        steps:
            - uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 1
            - name: PureData Sources
              run: |
                  sudo apt update
                  sudo add-apt-repository ppa:pure-data/pure-data -y
                  sudo apt install libboost-all-dev puredata -y
                  sudo apt install libx11-dev
            - name: Install aarch64 gcc
              if: matrix.arch == 'aarch64'
              run: |
                  sudo apt install gcc-aarch64-linux-gnu -y
                  sudo apt install g++-aarch64-linux-gnu -y
                  cmake . -B build -DPD_FLOATSIZE=${{ matrix.precision }} -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} -DPD_LIB_DIR=./ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
            - name: Install arm gcc
              if: matrix.arch == 'arm'
              run: |
                  sudo apt install gcc-arm-linux-gnueabihf -y
                  sudo apt install g++-arm-linux-gnueabihf -y
                  cmake . -B build -DPD_FLOATSIZE=${{ matrix.precision }} -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} -DPD_LIB_DIR=./ -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=arm-linux-gnueabihf-gcc -DCMAKE_CXX_COMPILER=arm-linux-gnueabihf-g++
            - name: Configure
              if: matrix.arch == 'amd64'
              run: |
                  cmake . -B build -DPD_FLOATSIZE=${{ matrix.precision }} -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} -DPD_LIB_DIR=./ -DCMAKE_BUILD_TYPE=Release
            - name: Build Object
              run: |
                  cmake --build build -- -j$(nproc)
            - name: Upload Object
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-pd${{ matrix.precision }}-linux-${{ matrix.arch }}
                  path: build/${{env.LIBNAME}}
    windows:
        runs-on: windows-latest
        strategy:
            matrix:
                arch: [amd64]
                precision: [32]
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  submodules: recursive
                  fetch-depth: 0
            - name: Set up MinGW64
              uses: msys2/setup-msys2@v2
              with:
                  msystem: MINGW64
                  install: >-
                      mingw-w64-x86_64-gcc
                      mingw-w64-x86_64-cmake
                      mingw-w64-x86_64-make
                      mingw-w64-x86_64-ninja
                      mingw-w64-x86_64-boost
                      mingw-w64-x86_64-mbedtls
                  update: false
            - name: Install PureData
              run: |
                  winget install -e --id MillerPuckette.PureData --accept-source-agreements
            - name: Configure and build with MinGW64
              shell: msys2 {0}
              run: |
                  gcc --version
                  g++ --version
                  cmake -S . -B build -G Ninja \
                    -DP2P_BUILD_MAX=ON \
                    -DPD_FLOATSIZE=${{ matrix.precision }} \
                    -DCMAKE_SYSTEM_PROCESSOR=${{ matrix.arch }} \
                    -DPD_LIB_DIR=./ \
                    -DCMAKE_BUILD_TYPE=Release \
                    -DCMAKE_C_COMPILER=/mingw64/bin/gcc.exe \
                    -DCMAKE_CXX_COMPILER=/mingw64/bin/g++.exe
                  cmake --build build --parallel
            - name: Upload Pure Data package
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-pd${{ matrix.precision }}-windows-${{ matrix.arch }}
                  path: build/${{env.LIBNAME}}
            - name: Upload Max package
              uses: actions/upload-artifact@v4
              with:
                  name: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-max-windows-${{ matrix.arch }}
                  path: build/${{ env.LIBNAME }}-max-package
                  if-no-files-found: error

    publish-release:
        if: ${{ inputs.publish_release }}
        permissions:
            contents: write
        needs: [macos, linux, windows]
        runs-on: ubuntu-latest
        steps:
            - name: Download Pure Data artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-pd*
                  merge-multiple: true
                  path: release/pd/${{ env.LIBNAME }}

            - name: Download Max artifacts
              uses: actions/download-artifact@v4
              with:
                  pattern: ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-max-*
                  merge-multiple: true
                  path: release/max/${{ env.LIBNAME }}

            - name: Verify release contents
              run: |
                  test -d release/pd/${{ env.LIBNAME }}
                  test -d release/max/${{ env.LIBNAME }}/externals
                  find release -maxdepth 4 -type f -print

            - name: Package and upload Pure Data library to Deken
              env:
                  DEKEN_USERNAME: charlesneimog
                  DEKEN_PASSWORD: ${{ secrets.DEKEN_PASSWORD }}
              run: |
                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    --volume "${{ github.workspace }}:/deken" \
                    --workdir /deken \
                    registry.git.iem.at/pd/deken \
                    deken package --version "${LIBVERSION}" "release/pd/${LIBNAME}"

                  shopt -s nullglob
                  deken_packages=(*.dek)
                  test ${#deken_packages[@]} -gt 0

                  docker run --rm \
                    --user "$(id -u):$(id -g)" \
                    --volume "${{ github.workspace }}:/deken" \
                    --workdir /deken \
                    -e DEKEN_USERNAME -e DEKEN_PASSWORD \
                    registry.git.iem.at/pd/deken \
                    deken upload -v "${LIBVERSION}" "${deken_packages[@]}"

            - name: Create Max package archive
              run: |
                  cd release/max
                  zip -r "${GITHUB_WORKSPACE}/${LIBNAME}-${LIBVERSION}-max.zip" "${LIBNAME}"

            - name: Create or update GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: v${{ env.LIBVERSION }}
                  name: v${{ env.LIBVERSION }}
                  target_commitish: ${{ github.sha }}
                  draft: true
                  prerelease: false
                  generate_release_notes: true
                  fail_on_unmatched_files: true
                  files: |
                      ${{ env.LIBNAME }}-${{ env.LIBVERSION }}-max.zip
